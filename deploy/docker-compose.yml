# WireDeck — запуск в один контейнер.
#
#   cd deploy
#   echo "WG_HOST=<публичный IP или домен>" > .env
#   docker compose up -d --build
#
# Панель: http://<IP>:8080, WireGuard: UDP 51820.

# Явное имя проекта: иначе compose взял бы имя каталога («deploy») — оно
# зависит от расположения и может пересечься с чужим проектом на том же хосте.
name: wiredeck

services:
  wiredeck:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: wiredeck
    restart: unless-stopped
    # Минимальный набор capabilities: NET_ADMIN — wg/ip, NET_RAW — iptables.
    # Он же покрывает движок awg: userspace-демон amneziawg-go создаёт TUN
    # через ioctl(TUNSETIFF), а это тоже CAP_NET_ADMIN. Дополнительных
    # capabilities для /dev/net/tun не нужно — доступ к самому символьному
    # устройству регулируется не capabilities, а device cgroup (секция
    # devices ниже) и правами на узел (crw-rw-rw-, процесс работает от root).
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      # Нужно движку WG_ENGINE=awg: userspace-реализация AmneziaWG поднимает
      # интерфейс через /dev/net/tun (модуля ядра amneziawg в контейнере нет).
      # Если на хосте узла нет — контейнер не стартует; лечится загрузкой
      # модуля: `modprobe tun` и строка `tun` в /etc/modules-load.d/tun.conf.
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      # UDP-порт WireGuard — подхватывает WG_PORT из .env автоматически.
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      # HTTP панели: PANEL_PORT — порт на хосте (внутри контейнера всегда 8080).
      # Рекомендуется спрятать за reverse proxy с TLS (см. README).
      - "${PANEL_PORT:-8080}:8080"
    environment:
      # Обязательно: публичный IP или домен сервера — попадает в Endpoint
      # клиентских конфигов. Задаётся в deploy/.env.
      WG_HOST: ${WG_HOST:?WG_HOST не задан — укажите публичный IP или домен сервера в deploy/.env}
      # Необязательные переопределения (пустое значение = дефолт сервера).
      WG_PORT: ${WG_PORT:-51820}
      WG_INTERFACE: ${WG_INTERFACE:-}
      WG_SUBNET: ${WG_SUBNET:-}
      WG_DNS: ${WG_DNS:-}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-}
      WG_MTU: ${WG_MTU:-}
      # Движок туннеля: wg (ванильный WireGuard, дефолт) | awg (AmneziaWG с
      # обфускацией против DPI). Для новых установок start.sh прописывает
      # WG_ENGINE=awg в .env. МЕНЯТЬ У РАБОТАЮЩЕЙ УСТАНОВКИ НЕЛЬЗЯ без
      # перевыдачи всех клиентских конфигов — движки несовместимы.
      WG_ENGINE: ${WG_ENGINE:-}
      # Параметры обфускации AmneziaWG (набор AWG 1.5). Пустое значение =
      # взять из БД (settings), где они сгенерированы один раз при первом
      # запуске в режиме awg. Задавать здесь имеет смысл только чтобы
      # воспроизвести конкретный набор — значения обязаны совпадать с теми,
      # что зашиты в уже выданные клиентские конфиги.
      AWG_JC: ${AWG_JC:-}
      AWG_JMIN: ${AWG_JMIN:-}
      AWG_JMAX: ${AWG_JMAX:-}
      AWG_S1: ${AWG_S1:-}
      AWG_S2: ${AWG_S2:-}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
      # COOKIE_SECURE=1 — флаг Secure на cookie сессии (панель за TLS-прокси).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-}
    volumes:
      # SQLite-база и конфиг интерфейса WireGuard — переживают пересоздание контейнера.
      - wiredeck_data:/data

volumes:
  wiredeck_data:
    # Явное имя: без него compose добавил бы префикс проекта (deploy_wiredeck_data),
    # и имя из документации/скриптов не совпадало бы с реальным.
    #
    # ВНИМАНИЕ: у установок, развёрнутых ДО появления этой строки, данные лежат
    # в томе с префиксом (обычно deploy_wiredeck_data). Голый `docker compose up`
    # в таком каталоге подключит ЭТОТ, пустой том — пропадут пользователи, ключи
    # сервера, статистика и пароль администратора. Переносом занимаются
    # ./start.sh и ./update.sh (функции plan_data_migration/do_data_migration),
    # поэтому поднимать панель на существующей установке нужно ими, а не руками
    # через compose.
    # Подробности и ручная проверка — README, раздел «Данные и миграция тома».
    name: wiredeck_data
